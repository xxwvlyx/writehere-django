<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід — WriteHere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center fw-bold text-primary">Вхід у WriteHere</h3>
                
                <form method="post">
                    {% csrf_token %}
                    <!-- Виводимо стандартну форму Django -->
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" required>
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Увійти</button>
                </form>
                
                <hr class="my-4">
                <div class="text-center small">
                    Немає акаунта? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Зареєструватися</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
