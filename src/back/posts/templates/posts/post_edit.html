<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати допис</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pt-5">
    <div class="container" style="max-width: 600px;">
        <h3 class="mb-4">Редагування допису</h3>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.content }}
                    </div>
                    <button type="submit" class="btn btn-success fw-bold">Зберегти зміни</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary ms-2">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
