<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Видалення допису</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pt-5">
    <div class="container" style="max-width: 600px;">
        <div class="alert alert-danger shadow-sm border-0">
            <h4 class="alert-heading">Ви впевнені?</h4>
            <p>Ви дійсно хочете видалити цей допис? Цю дію неможливо скасувати.</p>
            <hr>
            <p class="fst-italic text-muted mb-4">"{{ post.content }}"</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold">Так, видалити</button>
                <a href="{% url 'home' %}" class="btn btn-secondary ms-2">Скасувати</a>
            </form>
        </div>
    </div>
</body>
</html>
